name: Sync to LSPosed Repository

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: sync-lsposed
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to LSPosed Distribution Repo
        env:
          LSP_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lsposed "https://x-access-token:${LSP_TOKEN}@github.com/Xposed-Modules-Repo/io.github.marukon.imeauto.git"
          echo "Pushing main branch to Xposed-Modules-Repo/io.github.marukon.imeauto..."
          git push lsposed main:main --force
