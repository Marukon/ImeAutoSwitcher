name: Automated Release

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Custom tag override (Leave empty to auto-read from app/build.gradle.kts)"
        required: false
        default: ""
      release_title:
        description: "Release title (Leave empty for auto-generated title)"
        required: false
        default: ""
      release_notes:
        description: "Release notes / changelog"
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > app/release-keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "release-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Extract Version & Prepare Release Metadata
        id: meta
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=\s*' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/' | tr -d '[:space:]')
          
          echo "Extracted from code: versionName=$VERSION_NAME, versionCode=$VERSION_CODE"
          AUTO_TAG="v${VERSION_NAME}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
            if [ -z "$TAG" ]; then
              TAG="$AUTO_TAG"
            fi
            
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="ImeAutoSwitcher ${TAG}"
            fi
            
            NOTES="${{ github.event.inputs.release_notes }}"
            if [ -z "$NOTES" ]; then
              NOTES="Release ${TAG} (code ${VERSION_CODE}) for ImeAutoSwitcher (LSPosed API 102)."
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="ImeAutoSwitcher ${TAG}"
            NOTES="Release ${TAG} (code ${VERSION_CODE}) for ImeAutoSwitcher (LSPosed API 102)."
          else
            TAG="$AUTO_TAG"
            TITLE="ImeAutoSwitcher ${TAG}"
            NOTES="Release ${TAG} (code ${VERSION_CODE}) for ImeAutoSwitcher (LSPosed API 102)."
          fi
          
          echo "Release target: TAG=${TAG}, TITLE=${TITLE}"
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
          echo "TITLE=${TITLE}" >> $GITHUB_OUTPUT
          echo "NOTES=${NOTES}" >> $GITHUB_OUTPUT
          
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "${APK_PATH}" "./ImeAutoSwitcher-release.apk"
          echo "APK_FILE=./ImeAutoSwitcher-release.apk" >> $GITHUB_OUTPUT

      - name: Publish Release to LSPosed Distribution Repo
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          TAG: ${{ steps.meta.outputs.TAG_NAME }}
          TITLE: ${{ steps.meta.outputs.TITLE }}
          NOTES: ${{ steps.meta.outputs.NOTES }}
          APK_FILE: ${{ steps.meta.outputs.APK_FILE }}
        run: |
          echo "Checking release ${TAG} on Xposed-Modules-Repo/io.github.marukon.imeauto..."
          TARGET_REPO="Xposed-Modules-Repo/io.github.marukon.imeauto"
          if gh release view "${TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading/overwriting asset with --clobber..."
            gh release upload "${TAG}" "${APK_FILE}#ImeAutoSwitcher-release.apk" \
              --repo "${TARGET_REPO}" \
              --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" "${APK_FILE}#ImeAutoSwitcher-release.apk" \
              --repo "${TARGET_REPO}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi

      - name: Sync Codebase to LSPosed Repo on Release Success
        env:
          LSP_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          echo "Release APK successfully published. Now syncing codebase to LSPosed repo..."
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lsposed "https://${LSP_TOKEN}@github.com/Xposed-Modules-Repo/io.github.marukon.imeauto.git" || git remote set-url lsposed "https://${LSP_TOKEN}@github.com/Xposed-Modules-Repo/io.github.marukon.imeauto.git"
          git push lsposed main:main --force
          echo "Codebase successfully synced to LSPosed distribution repo."

      - name: Clean up Keystore and Build Artifacts
        if: always()
        run: |
          echo "Cleaning up sensitive files and build artifacts..."
          rm -f app/release-keystore.jks
          rm -f ./ImeAutoSwitcher-release.apk
          rm -rf app/build/
          rm -rf build/
          rm -rf ~/.gradle/caches/
